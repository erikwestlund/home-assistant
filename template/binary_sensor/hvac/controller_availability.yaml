# --- Rollups ---
#
# INVARIANT, load-bearing across two repos: the life app treats
# binary_sensor.hvac_controller_outage_alert as the SOLE gate. An alert of "off"
# is a complete answer there — it returns "healthy" without reading any other
# entity — so nothing downstream can catch a fault in this chain.
#
# Therefore every sensor between sensor.hvac_offline_controller_count and the
# alert must go UNAVAILABLE when its input is bad, never fall back to a default
# that happens to read as "off" or 0. A silent all-clear is the one outcome this
# alert exists to prevent, and it is indistinguishable from a healthy house.
#
# If you add a hop to this chain, give it an `availability:` template too, and
# tell whoever maintains ~/Projects/life — from there this is one boolean and
# the extra hop is invisible.

# Undebounced. Flickers on brief integration reloads — do not alert on this
# directly, use hvac_controller_outage_alert below.
- name: "HVAC Any Controller Offline"
  unique_id: hvac_any_controller_offline
  device_class: problem
  state: >
    {{ states('sensor.hvac_offline_controller_count') | int(0) > 0 }}
  # Without this, a non-numeric count falls through `| int(0)` to 0, which reads
  # as "off" — a broken sensor chain would render as a healthy house. Going
  # unavailable instead makes consumers show "status unknown" rather than a
  # silent all-clear. This is the whole point of the alert, so it must not be
  # the one thing that fails quietly.
  availability: >
    {{ states('sensor.hvac_offline_controller_count') | is_number }}

# All six LG units down at once means the ThinQ integration or the internet is
# the problem, not one unit. Changes what the alert should tell you to do.
- name: "HVAC LG ThinQ Offline"
  unique_id: hvac_lg_thinq_offline
  device_class: problem
  state: >
    {{ [
      'binary_sensor.hvac_controller_offline_ducted',
      'binary_sensor.hvac_controller_offline_master_bedroom',
      'binary_sensor.hvac_controller_offline_living_room',
      'binary_sensor.hvac_controller_offline_dining_room',
      'binary_sensor.hvac_controller_offline_family_room',
      'binary_sensor.hvac_controller_offline_tinas_office',
    ] | select('is_state', 'on') | list | count == 6 }}

# The alerting entity. Debounced so an integration reload or a momentary blip
# does not page anyone. This is what the life app and Grafana should show.
- name: "HVAC Controller Outage Alert"
  unique_id: hvac_controller_outage_alert
  device_class: problem
  state: >
    {{ is_state('binary_sensor.hvac_any_controller_offline', 'on') }}
  # Propagate the same failure semantics: if the chain below is broken, this
  # goes unavailable rather than reporting a clear house. The life app treats an
  # unavailable alert entity as "degraded" and shows an amber banner, so a
  # broken chain surfaces instead of disappearing.
  availability: >
    {{ states('binary_sensor.hvac_any_controller_offline') in ['on', 'off'] }}
  delay_on: >
    {{ (states('input_number.hvac_controller_offline_alert_minutes') | int(5)) * 60 }}
  # Hold the alert through a short recovery so a flapping ThinQ connection reads
  # as one continuous outage rather than a burst of separate ones. This also
  # keeps input_datetime.hvac_controller_outage_started from being re-stamped
  # mid-flap, which is what makes sensor.hvac_controller_outage_minutes honest.
  delay_off: 120
  icon: >
    {{ 'mdi:hvac-off' if is_state('binary_sensor.hvac_controller_outage_alert', 'on') else 'mdi:hvac' }}
