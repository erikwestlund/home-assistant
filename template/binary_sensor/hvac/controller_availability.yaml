# Controller availability
#
# When a thermostat's integration loses its cloud/LAN connection the climate
# entity goes `unavailable`, HA can no longer change the setpoint, and the unit
# holds whatever it was last told. That is dangerous for the ducted system in
# particular: HA idles it by parking it at an unreachable setpoint, so a stuck
# controller means the kids' rooms sit at the parked value indefinitely.
#
# All six LG units share one `lg_thinq` config entry, so they drop together.
# `on` = offline (device_class: problem), so it reads correctly in alerts,
# on the dashboard, and in Grafana where 1 = bad.

# --- LG ThinQ ---
- name: "HVAC Controller Offline Ducted"
  unique_id: hvac_controller_offline_ducted
  device_class: problem
  state: >
    {{ states('climate.ducted_heat_pump') in ['unavailable', 'unknown', 'none', 'None'] }}
  icon: >
    {{ 'mdi:lan-disconnect' if is_state('binary_sensor.hvac_controller_offline_ducted', 'on') else 'mdi:lan-connect' }}

