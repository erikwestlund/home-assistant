# --- Rollups ---

# Undebounced. Flickers on brief integration reloads — do not alert on this
# directly, use hvac_controller_outage_alert below.
- name: "HVAC Any Controller Offline"
  unique_id: hvac_any_controller_offline
  device_class: problem
  state: >
    {{ states('sensor.hvac_offline_controller_count') | int(0) > 0 }}

# All six LG units down at once means the ThinQ integration or the internet is
# the problem, not one unit. Changes what the alert should tell you to do.
- name: "HVAC LG ThinQ Offline"
  unique_id: hvac_lg_thinq_offline
  device_class: problem
  state: >
    {{ [
      'binary_sensor.hvac_controller_offline_ducted',
      'binary_sensor.hvac_controller_offline_master_bedroom',
      'binary_sensor.hvac_controller_offline_living_room',
      'binary_sensor.hvac_controller_offline_dining_room',
      'binary_sensor.hvac_controller_offline_family_room',
      'binary_sensor.hvac_controller_offline_tinas_office',
    ] | select('is_state', 'on') | list | count == 6 }}

# The alerting entity. Debounced so an integration reload or a momentary blip
# does not page anyone. This is what the life app and Grafana should show.
- name: "HVAC Controller Outage Alert"
  unique_id: hvac_controller_outage_alert
  device_class: problem
  state: >
    {{ is_state('binary_sensor.hvac_any_controller_offline', 'on') }}
  delay_on: >
    {{ (states('input_number.hvac_controller_offline_alert_minutes') | int(5)) * 60 }}
  # Hold the alert through a short recovery so a flapping ThinQ connection reads
  # as one continuous outage rather than a burst of separate ones. This also
  # keeps input_datetime.hvac_controller_outage_started from being re-stamped
  # mid-flap, which is what makes sensor.hvac_controller_outage_minutes honest.
  delay_off: 120
  icon: >
    {{ 'mdi:hvac-off' if is_state('binary_sensor.hvac_controller_outage_alert', 'on') else 'mdi:hvac' }}
