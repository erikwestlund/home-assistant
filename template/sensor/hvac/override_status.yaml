# 🕒 Override expiry, for display only.
#
# input_datetime.hvac_override_until_* is never cleared when an override ends
# -- the expiry automation turns the *boolean* off and leaves the timestamp
# where it was. So the stored datetime is only meaningful while its matching
# input_boolean.hvac_override_status_* is on. Reading it unconditionally is
# how every room came to advertise an override expiry it did not have, one of
# them dated April 2025.
#
# The boolean is the source of truth for "is an override active"; this sensor
# only answers "until when", and says nothing when the answer is nothing.

- name: "HVAC Office Override Until"
  state: >
    {% if not is_state('input_boolean.hvac_override_status_office', 'on') %}
      Not Set
    {% else %}
      {% set override_time = states('input_datetime.hvac_override_until_office') %}
      {% if override_time not in ['unknown', 'unavailable', 'None'] %}
        {% set parsed_time = override_time | as_datetime(default=None) %}
        {% if parsed_time %}
          {{ parsed_time.strftime('%b %d, %I:%M %p') }}
        {% else %}
          Not Set
        {% endif %}
      {% else %}
        Not Set
      {% endif %}
    {% endif %}

