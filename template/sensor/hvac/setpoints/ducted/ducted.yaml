# HVAC Setpoint Ducted
- name: "HVAC Setpoint Ducted"
  unique_id: hvac_setpoint_ducted
  state: >
    {% set mode = states('sensor.hvac_mode') %}
    {% set is_off = is_state('binary_sensor.hvac_ducted_power_status', 'off') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if is_off %}
      None
    {% elif is_heating %}
      {{ states('input_number.hvac_active_setpoint_ducted') }}
    {% elif is_cooling %}
      {{ states('input_number.hvac_active_setpoint_cooling_ducted') }}
    {% elif mode == 'Heat' %}
      {{ states('input_number.hvac_off_setpoint_ducted') }}
    {% elif mode == 'Cool' %}
      {#- Parked (idle) cooling setpoint: park just ABOVE where HA takes over.

          Two jobs, and they pull in opposite directions. The unit is never
          powered off to idle it, so whatever it is parked at is (a) what the
          LG's own thermostat will chase whenever HA is not calling, and (b)
          what the unit holds forever if the ThinQ controller drops offline.

          Park too low and the LG quietly becomes the real controller: at a
          flat 76 it holds 75.2F all day, undercutting the 76 day target that
          exists to keep cost down. Park too high (the old 82) and a stuck
          controller cooks the rooms.

          So park one step above the call threshold. HA always calls first —
          at 77 by day, 74.5 at night — which keeps the LG's thermostat inert
          in normal operation and leaves the parked value doing only its
          safety job.

              day    76 + 1.0 = 77    -> park 78  (LG stores 26C = 78.8F)
              night  73.5 + 1.0 = 74.5 -> park 76  (LG stores 24C = 75.2F)

          Even F only: the LG stores whole C and silently converts odd values
          (75 becomes 74). The +1 margin covers the C rounding, which is not
          symmetric — 76 rounds down to 24C = 75.2F while 78 rounds up to
          26C = 78.8F. hvac_off_setpoint_cooling_ducted caps the result so a
          raised target can never park the system somewhere dangerous. -#}
      {% set target = states('sensor.hvac_target_ducted') | float(76) %}
      {% set over_start = states('input_number.hvac_over_target_start_threshold_ducted') | float(1) %}
      {% set parked = (((target + over_start + 1) / 2) | round(0, 'ceil') | int) * 2 %}
      {% set ceiling = states('input_number.hvac_off_setpoint_cooling_ducted') | float(78) %}
      {{ [parked, ceiling] | min | round(0) | int }}
    {% else %}
      None
    {% endif %}
  unit_of_measurement: "°F"
  icon: >
    {% set state = states('sensor.hvac_setpoint_ducted') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if state == 'None' %}
      mdi:power
    {% elif is_heating %}
      mdi:fire
    {% elif is_cooling %}
      mdi:snowflake
    {% else %}
      mdi:thermometer
    {% endif %}