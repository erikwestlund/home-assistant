# HVAC Setpoint Ducted
- name: "HVAC Setpoint Ducted"
  unique_id: hvac_setpoint_ducted
  state: >
    {% set mode = states('sensor.hvac_mode') %}
    {% set is_off = is_state('binary_sensor.hvac_ducted_power_status', 'off') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if is_off %}
      None
    {% elif is_heating %}
      {{ states('input_number.hvac_active_setpoint_ducted') }}
    {% elif is_cooling %}
      {{ states('input_number.hvac_active_setpoint_cooling_ducted') }}
    {% elif mode == 'Heat' %}
      {{ states('input_number.hvac_off_setpoint_ducted') }}
    {% elif mode == 'Cool' %}
      {#- Parked (idle) cooling setpoint — a fixed value, deliberately.

          HA does not power the ducted unit off to idle it, it parks it at a
          setpoint, and the unit holds that value if the ThinQ controller drops
          off the internet (HA then has no channel to change it). So this has to
          be safe to be stuck at indefinitely, at any hour.

          This does NOT track sensor.hvac_target_ducted. The target is the
          control point — where the call-for-cooling hysteresis is centred — and
          at night it is 73.5, which is colder than the house should merely
          *rest* at. Idle temperature and control target are separate concerns.

          hvac_off_setpoint_cooling_ducted is 76, which is how you ask an LG for
          75: the units store whole C, so the reachable steps here are 23C =
          73.4F, 24C = 75.2F, 25C = 77F. There is no 75 setting — sending 75 is
          converted down to 74 (see lg_converted_setpoints.yaml). Sending 76
          stores 24C and the rooms rest at 75.2F. -#}
      {{ states('input_number.hvac_off_setpoint_cooling_ducted') }}
    {% else %}
      None
    {% endif %}
  unit_of_measurement: "°F"
  icon: >
    {% set state = states('sensor.hvac_setpoint_ducted') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if state == 'None' %}
      mdi:power
    {% elif is_heating %}
      mdi:fire
    {% elif is_cooling %}
      mdi:snowflake
    {% else %}
      mdi:thermometer
    {% endif %}