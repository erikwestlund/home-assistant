# HVAC Setpoint Ducted
- name: "HVAC Setpoint Ducted"
  unique_id: hvac_setpoint_ducted
  state: >
    {% set mode = states('sensor.hvac_mode') %}
    {% set is_off = is_state('binary_sensor.hvac_ducted_power_status', 'off') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if is_off %}
      None
    {% elif is_heating %}
      {{ states('input_number.hvac_active_setpoint_ducted') }}
    {% elif is_cooling %}
      {{ states('input_number.hvac_active_setpoint_cooling_ducted') }}
    {% elif mode == 'Heat' %}
      {{ states('input_number.hvac_off_setpoint_ducted') }}
    {% elif mode == 'Cool' %}
      {#- Parked (idle) cooling setpoint.

          HA does not power the ducted unit off to idle it, it parks it at a
          setpoint. Whatever it is parked at is what it holds if the ThinQ
          controller drops off the internet, because HA then has no channel to
          change it — so the parked value has to be safe to be stuck at
          indefinitely, at any hour.

          Parking AT the current period's target (76 by day, 73.5 -> 74 at
          night) satisfies that, and unlike a fixed low value it never fights
          HA's own call logic: the LG holds the target on its own and HA's
          active cooling setpoint acts as a boost when a room runs hot.

          Rounded to an even F because the LG only stores 1C steps and would
          silently round an odd value (see lg_converted_setpoints.yaml).
          hvac_off_setpoint_cooling_ducted is now a hard ceiling rather than
          the parked value itself, so a mis-set target can never park the
          system somewhere dangerous. -#}
      {% set target = states('sensor.hvac_target_ducted') | float(76) %}
      {% set parked = ((target / 2) | round(0) | int) * 2 %}
      {% set ceiling = states('input_number.hvac_off_setpoint_cooling_ducted') | float(76) %}
      {{ [parked, ceiling] | min | round(0) | int }}
    {% else %}
      None
    {% endif %}
  unit_of_measurement: "°F"
  icon: >
    {% set state = states('sensor.hvac_setpoint_ducted') %}
    {% set is_heating = is_state('binary_sensor.hvac_calling_for_heat_ducted', 'on') %}
    {% set is_cooling = is_state('binary_sensor.hvac_calling_for_cooling_ducted', 'on') %}

    {% if state == 'None' %}
      mdi:power
    {% elif is_heating %}
      mdi:fire
    {% elif is_cooling %}
      mdi:snowflake
    {% else %}
      mdi:thermometer
    {% endif %}