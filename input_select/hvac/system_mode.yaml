hvac_mode:
  name: HVAC System Mode
  options:
    - "Off"
    - "Heat"
    - "Cool"
  # No `initial:` on purpose: HA restores the last selected mode on restart,
  # which is always what we want. Nothing sets this automatically -- it is
  # changed by hand only. See CLAUDE.md on `initial:` semantics.
  icon: mdi:home-group
