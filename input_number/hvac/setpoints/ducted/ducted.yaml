# Ducted (kids' rooms) setpoints.
#
# The ducted unit is not powered off to idle it — HA parks it at a setpoint it
# will not reach. That makes the parked value a safety-critical number: if the
# ThinQ controller drops offline while parked, the unit holds that setpoint
# until someone power-cycles the controller. Park high enough to idle in normal
# conditions, low enough that being stuck there is survivable.
#
# Reminder (CLAUDE.md): `initial:` stays commented; the live value is set in the
# UI. The comments below record the intended value.

hvac_off_setpoint_ducted:
  name: HVAC Ducted Off Setpoint
  min: 62
  max: 86
  step: 1
  unit_of_measurement: "°F"
  # initial: 62

hvac_off_setpoint_cooling_ducted:
  name: HVAC Ducted Off Setpoint (Cooling)
  min: 62
  max: 86
  step: 1
  unit_of_measurement: "°F"
  # The temperature the kids' rooms REST at whenever the system is not actively
  # calling for cooling — a fixed value, independent of the control target.
  #
  # 76 here means 75 in the room: the LG stores whole °C, so the reachable steps
  # are 23°C = 73.4°F, 24°C = 75.2°F, 25°C = 77°F. Sending 75 is converted down
  # to 74. Do not "correct" this to 75.
  #
  # Also the value the unit is stuck holding if the ThinQ controller drops
  # offline, so it has to be safe at any hour. Was 82, which cooked the rooms.
  # initial: 76

hvac_active_setpoint_ducted:
  name: HVAC Ducted Active Setpoint
  min: 62
  max: 86
  step: 1
  unit_of_measurement: "°F"
  # initial: 72

hvac_active_setpoint_cooling_ducted:
  name: HVAC Ducted Active Setpoint (Cooling)
  min: 62
  max: 86
  step: 1
  unit_of_measurement: "°F"
  # Was 68, which overcools and is a cold room to be stuck in if the controller
  # drops mid-cycle. Even °F, so the LG accepts it as-is.
  # initial: 70