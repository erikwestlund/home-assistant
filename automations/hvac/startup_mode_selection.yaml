# Pick an HVAC mode from season and outdoor temperature.
#
# This deliberately has NO trigger. It used to fire on `homeassistant start`,
# which overwrote the restored mode ~30s after every restart: in May/September a
# restart on a cool morning would read outdoor temp < 65 and flip the whole house
# to Heat. `input_select.hvac_mode` has no `initial:`, so HA already restores the
# last mode on its own -- removing the trigger is what makes a restart keep it.
#
# Kept as a manually runnable action (Settings -> Automations -> Run actions) for
# when you do want the seasonal default applied, e.g. at a season change.
#
# Note: with no stored state at all, input_select falls back to its first option,
# which is "Off". That is the safe direction, and it is indistinguishable from
# deliberately choosing "Off" -- which is why this cannot be a conditional
# "only if unset" fallback.
- alias: "HVAC: Set Mode Based on Season (manual)"
  id: hvac_set_mode_based_on_season_at_startup
  description: "Select Heat or Cool based on season and outdoor temperature. Run manually; does not fire on Home Assistant start."
  trigger: []
  condition: []
  action:
    # Set mode based on month and temperature
    - choose:
        # June, July, August - Always Cool
        - conditions:
            - condition: template
              value_template: "{{ now().month in [6, 7, 8] }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.hvac_mode
              data:
                option: "Cool"
            - service: system_log.write
              data:
                message: "HVAC mode set to Cool - Summer month ({{ now().strftime('%B') }})"
                level: info
        
        # October through April - Always Heat
        - conditions:
            - condition: template
              value_template: "{{ now().month in [10, 11, 12, 1, 2, 3, 4] }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.hvac_mode
              data:
                option: "Heat"
            - service: system_log.write
              data:
                message: "HVAC mode set to Heat - Winter month ({{ now().strftime('%B') }})"
                level: info
        
        # May and September - Decide based on temperature
        - conditions:
            - condition: template
              value_template: "{{ now().month in [5, 9] }}"
          sequence:
            - choose:
                # If temp below 65°F, set to Heat
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.current_nws_outdoor_temperature
                      below: 65
                  sequence:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.hvac_mode
                      data:
                        option: "Heat"
                    - service: system_log.write
                      data:
                        message: "HVAC mode set to Heat - {{ now().strftime('%B') }}, outdoor temp is {{ states('sensor.current_nws_outdoor_temperature') }}°F"
                        level: info
                
                # If temp above 75°F, set to Cool
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.current_nws_outdoor_temperature
                      above: 75
                  sequence:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.hvac_mode
                      data:
                        option: "Cool"
                    - service: system_log.write
                      data:
                        message: "HVAC mode set to Cool - {{ now().strftime('%B') }}, outdoor temp is {{ states('sensor.current_nws_outdoor_temperature') }}°F"
                        level: info
                
                # If temp between 65-75°F, set to Off
                - conditions:
                    - condition: numeric_state
                      entity_id: sensor.current_nws_outdoor_temperature
                      above: 65
                    - condition: numeric_state
                      entity_id: sensor.current_nws_outdoor_temperature
                      below: 75
                  sequence:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.hvac_mode
                      data:
                        option: "Off"
                    - service: system_log.write
                      data:
                        message: "HVAC mode set to Off - {{ now().strftime('%B') }}, outdoor temp is {{ states('sensor.current_nws_outdoor_temperature') }}°F"
                        level: info
              
              # Default for May/Sept if temp unavailable
              default:
                - service: system_log.write
                  data:
                    message: "Unable to read outdoor temperature in {{ now().strftime('%B') }}, defaulting to Off"
                    level: warning
                - service: input_select.select_option
                  target:
                    entity_id: input_select.hvac_mode
                  data:
                    option: "Off"