- id: "hvac_sync_ducted_power_mode_setpoint"
  alias: "HVAC Sync Ducted System Power, Mode, and Setpoint"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.hvac_ducted_power_synced
        - binary_sensor.hvac_ducted_mode_synced
        - binary_sensor.hvac_ducted_setpoint_synced
        - input_boolean.ducted_override_status
        - input_boolean.hvac_away_mode
      to: "off"
    - platform: time_pattern
      minutes: "/5"
    # Force an immediate resync the moment the controller comes back, rather
    # than waiting up to 5 minutes for the time pattern. The synced sensors are
    # already "off" during an outage, so they produce no new state trigger on
    # recovery.
    - platform: state
      entity_id: binary_sensor.hvac_controller_offline_ducted
      from: "on"
      to: "off"
  condition:
    - condition: state
      entity_id: input_boolean.hvac_control
      state: "on"
    # Nothing to do while the ThinQ controller is unreachable — the service
    # calls below would just fail every 5 minutes and fill the log.
    - condition: state
      entity_id: binary_sensor.hvac_controller_offline_ducted
      state: "off"
  action:
    - choose:
        # ✅ Power, Mode, and Setpoint All at Once if Ducted System is Off
        - conditions:
            - condition: state
              entity_id: binary_sensor.hvac_ducted_power_synced
              state: "off"
          sequence:
            - service: climate.set_hvac_mode
              data:
                entity_id: climate.ducted_heat_pump
                hvac_mode: >
                  {% if is_state('binary_sensor.hvac_ducted_power_status', 'on') %}
                    {% if is_state('sensor.hvac_mode', 'Heat') %}
                      heat
                    {% else %}
                      cool
                    {% endif %}
                  {% else %}
                    off
                  {% endif %}
            # Only push a setpoint we actually computed. The old
            # `| float(68)` fallback meant an unknown/None setpoint silently
            # commanded 68F — full cooling — at the kids' rooms.
            - if:
                - condition: template
                  value_template: >
                    {{ states('sensor.hvac_setpoint_ducted') | is_number }}
              then:
                - service: climate.set_temperature
                  data:
                    entity_id: climate.ducted_heat_pump
                    temperature: >
                      {{ states('sensor.hvac_setpoint_ducted') | float }}
            - service: logbook.log
              data:
                name: "HVAC Ducted Sync"
                message: >
                  Ducted system turned on. Mode set to:
                  {{ states('sensor.hvac_mode') }} and temperature set to:
                  {{ states('sensor.hvac_setpoint_ducted') }}°F.

        # ✅ Correct Mode and Setpoint if Mode is Incorrect
        - conditions:
            - condition: state
              entity_id: binary_sensor.hvac_ducted_mode_synced
              state: "off"
          sequence:
            - service: climate.set_hvac_mode
              data:
                entity_id: climate.ducted_heat_pump
                hvac_mode: >
                  {% if is_state('sensor.hvac_mode', 'Heat') %}
                    heat
                  {% else %}
                    cool
                  {% endif %}
            # Only push a setpoint we actually computed. The old
            # `| float(68)` fallback meant an unknown/None setpoint silently
            # commanded 68F — full cooling — at the kids' rooms.
            - if:
                - condition: template
                  value_template: >
                    {{ states('sensor.hvac_setpoint_ducted') | is_number }}
              then:
                - service: climate.set_temperature
                  data:
                    entity_id: climate.ducted_heat_pump
                    temperature: >
                      {{ states('sensor.hvac_setpoint_ducted') | float }}
            - service: logbook.log
              data:
                name: "HVAC Ducted Sync"
                message: >
                  Mode corrected to:
                  {{ states('sensor.hvac_mode') }} and temperature set to:
                  {{ states('sensor.hvac_setpoint_ducted') }}°F.

        # ✅ Correct Temperature
        - conditions:
            - condition: state
              entity_id: binary_sensor.hvac_ducted_setpoint_synced
              state: "off"
          sequence:
            # Only push a setpoint we actually computed. The old
            # `| float(68)` fallback meant an unknown/None setpoint silently
            # commanded 68F — full cooling — at the kids' rooms.
            - if:
                - condition: template
                  value_template: >
                    {{ states('sensor.hvac_setpoint_ducted') | is_number }}
              then:
                - service: climate.set_temperature
                  data:
                    entity_id: climate.ducted_heat_pump
                    temperature: >
                      {{ states('sensor.hvac_setpoint_ducted') | float }}
            - service: logbook.log
              data:
                name: "HVAC Ducted Sync"
                message: >
                  Temperature set to:
                  {{ states('sensor.hvac_setpoint_ducted') }}°F.
  mode: single