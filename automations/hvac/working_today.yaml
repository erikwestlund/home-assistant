# Tina Office
# Early work mode
- id: "hvac_start_early_work_mode_office"
  alias: "HVAC Start Early Work Mode Office"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_early_work_mode_start_time_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_early_work_mode_start_time_office')[3:5] | int }}
    - condition: state
      entity_id: input_boolean.hvac_early_work_mode_office
      state: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hvac_working_today_office
  mode: single

- id: "hvac_end_early_work_mode_office"
  alias: "HVAC End Early Work Mode Office"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_early_work_mode_end_time_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_early_work_mode_end_time_office')[3:5] | int }}
    - condition: state
      entity_id: input_boolean.hvac_early_work_mode_office
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hvac_working_today_office
  mode: single

# Regular day
- id: "hvac_set_working_at_start_time_office"
  alias: "HVAC Set Working at Start Time Office"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_apply_working_start_time_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_apply_working_start_time_office')[3:5] | int }}
    - condition: state
      entity_id: binary_sensor.is_weekday
      state: "on"
  action:
    # Requires a confirmed `on`, unlike Erik's office above: an unknown here
    # stays off rather than assuming a working day.
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.tina_home
              state: "on"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.hvac_working_today_office
  mode: single

- id: "hvac_reset_working_today_office"
  alias: "HVAC Reset Office Working Today"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_apply_working_end_time_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_apply_working_end_time_office')[3:5] | int }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hvac_working_today_office

- id: "hvac_set_working_today_before_monitor_end_office"
  alias: "HVAC Set Working Today Before Monitor End Office"
  trigger:
    # No `from:` guard. The tracker can go unavailable (it did, for days),
    # and unavailable -> on is a real arrival that `from: "off"` would drop.
    - platform: state
      entity_id: binary_sensor.tina_home
      to: "on"
  condition:
    - condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.is_weekday
          state: "on"
        - condition: template
          # The bounds check is a string compare, so an unknown monitor end
          # would read as '07:12:00' < 'unknown' -- true, because a digit
          # sorts below a letter. Require a real time first.
          value_template: >
            {% set monitor_end = states('sensor.hvac_occupancy_monitor_office_end') %}
            {{ monitor_end is match('^[0-9]{2}:[0-9]{2}:[0-9]{2}$')
               and now().strftime('%H:%M:%S') < monitor_end }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hvac_working_today_office
  mode: single

# Set Working at Start Time for Erik Office
- id: "hvac_set_working_at_start_time_erik_office"
  alias: "HVAC Set Working at Start Time Erik Office"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_apply_working_start_time_erik_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_apply_working_start_time_erik_office')[3:5] | int }}
    - condition: state
      entity_id: binary_sensor.is_weekday
      state: "on"
    # Assume working unless presence positively says otherwise. This is
    # deliberately asymmetric with Tina's office below, which requires a
    # confirmed `on`.
    #
    # erik_home goes unavailable when its tracker drops out of UniFi's client
    # list, which is not a rare edge -- it happened at the gateway swap on
    # 2026-09-20 and lasted days. Requiring `on` meant the flag silently
    # stopped being set for the whole outage. Testing for `off` inverts which
    # way an unknown fails: a wasted morning of conditioning an empty office,
    # rather than a cold one with no indication why.
    - condition: template
      value_template: >
        {{ not is_state('binary_sensor.erik_home', 'off') }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hvac_working_today_erik_office
  mode: single

# Reset Working Today for Erik Office
- id: "hvac_reset_working_today_erik_office"
  alias: "HVAC Reset Working Today Erik Office"
  trigger:
    - platform: time_pattern
      minutes: "*"
  condition:
    - condition: template
      value_template: >
        {{ now().hour == states('input_datetime.hvac_apply_working_end_time_erik_office')[:2] | int and 
           now().minute == states('input_datetime.hvac_apply_working_end_time_erik_office')[3:5] | int }}
    - condition: state
      entity_id: binary_sensor.is_weekday
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hvac_working_today_erik_office

# Set Working Today Before Monitor End for Erik Office
- id: "hvac_set_working_today_before_monitor_end_erik_office"
  alias: "HVAC Set Working Today Before Monitor End Erik Office"
  trigger:
    # No `from:` guard. The tracker can go unavailable (it did, for days),
    # and unavailable -> on is a real arrival that `from: "off"` would drop.
    - platform: state
      entity_id: binary_sensor.erik_home
      to: "on"
  condition:
    - condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.is_weekday
          state: "on"
        - condition: template
          # The bounds check is a string compare, so an unknown monitor end
          # would read as '07:12:00' < 'unknown' -- true, because a digit
          # sorts below a letter. Require a real time first.
          value_template: >
            {% set monitor_end = states('sensor.hvac_occupancy_monitor_erik_office_end') %}
            {{ monitor_end is match('^[0-9]{2}:[0-9]{2}:[0-9]{2}$')
               and now().strftime('%H:%M:%S') < monitor_end }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hvac_working_today_erik_office
  mode: single