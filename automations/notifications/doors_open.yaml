- id: master_bedroom_interior_door_open_too_long
  alias: "Master Bedroom Door Open Too Long"
  description: "Send a notification if the master bedroom interior door is open for more than 5 minutes during bedtime hours."
  trigger:
    - platform: state
      entity_id: binary_sensor.master_bedroom_interior_door_contact
      to: "on"
      for: "00:05:00"
  condition:
    - condition: template
      value_template: >
        {# Was reading .master_bedroom_bedtime_start_time / .._sleep_start_time,
           neither of which exists -- the helpers are hvac_-prefixed and
           suffixed with the room. Both sides rendered "unknown", and
           'unknown' <= '21:43:00' is false, so this never fired. The window
           is the Night period up to Sleep, matching the description. #}
        {% set now_time = now().strftime('%H:%M:%S') %}
        {% set bedtime = states('input_datetime.hvac_nighttime_start_time_master_bedroom') %}
        {% set sleeptime = states('input_datetime.hvac_sleep_start_time_master_bedroom') %}
        {{ bedtime not in ['unknown', 'unavailable']
           and sleeptime not in ['unknown', 'unavailable']
           and bedtime <= now_time <= sleeptime }}
  action:
    - service: notify.mobile_app_eriks_iphone
      data:
        title: "Master Bedroom Interior Door Open Alert"
        message: "The master bedroom interior door has been open for over 5 minutes. Please check."

